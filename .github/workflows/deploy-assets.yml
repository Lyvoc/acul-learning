name: Deploy ACUL Assets to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_URL: https://acul-learning-155.vercel.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧹 Clean folders
        run: rm -rf dist dist-combined

      - name: 🏗️ Build and collect Login ID assets
        run: |
          npm run build:login-id
          mkdir -p dist-combined/assets
          cp -r dist/assets/* dist-combined/assets/
          # Save asset list for this screen
          mkdir -p asset-tracking
          ls dist/assets/ | grep -E '\.(js|css)$' > asset-tracking/login-id.txt
          echo "Login ID assets:" && cat asset-tracking/login-id.txt

      - name: 🏗️ Build and collect Signup assets
        run: |
          rm -rf dist
          npm run build:signup
          cp -r dist/assets/* dist-combined/assets/
          ls dist/assets/ | grep -E '\.(js|css)$' > asset-tracking/signup.txt
          echo "Signup assets:" && cat asset-tracking/signup.txt

      - name: 🏗️ Build and collect Consent assets
        run: |
          rm -rf dist
          npm run build:consent
          cp -r dist/assets/* dist-combined/assets/
          ls dist/assets/ | grep -E '\.(js|css)$' > asset-tracking/consent.txt
          echo "Consent assets:" && cat asset-tracking/consent.txt

      - name: 📄 Create vercel.json
        run: |
          cat > dist-combined/vercel.json << 'EOF'
          {
            "version": 2,
            "builds": [],
            "cleanUrls": true,
            "trailingSlash": false,
            "headers": [
              {
                "source": "/(.*)",
                "headers": [
                  {"key": "Access-Control-Allow-Origin", "value": "*"},
                  {"key": "Access-Control-Allow-Methods", "value": "GET, OPTIONS"}
                ]
              },
              {
                "source": "/assets/(.*)",
                "headers": [
                  {"key": "Cache-Control", "value": "public, max-age=31536000, immutable"}
                ]
              }
            ]
          }
          EOF

      - name: 📋 List all combined assets
        run: |
          echo "All assets combined:"
          ls -lah dist-combined/assets/

      - name: 📁 Prepare deployment directory
        run: |
          mkdir -p deploy-temp
          cp -r dist-combined/* deploy-temp/
          cp -r asset-tracking deploy-temp/
          rm -f deploy-temp/package.json deploy-temp/vite.config.js

      - name: 🚀 Install Vercel CLI
        run: npm install --global vercel@latest

      - name: 🚢 Deploy to Vercel
        run: |
          cd deploy-temp
          vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🔄 Update Auth0 Login ID Configuration
        env:
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_MGMT_TOKEN: ${{ secrets.AUTH0_MGMT_TOKEN }}
          VERCEL_URL: ${{ env.VERCEL_URL }}
          SCREEN_NAME: login-id
          ASSET_LIST_FILE: asset-tracking/login-id.txt
        run: node scripts/update-auth0-screen.js

      - name: 🔄 Update Auth0 Signup Configuration
        env:
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_MGMT_TOKEN: ${{ secrets.AUTH0_MGMT_TOKEN }}
          VERCEL_URL: ${{ env.VERCEL_URL }}
          SCREEN_NAME: signup
          ASSET_LIST_FILE: asset-tracking/signup.txt
        run: node scripts/update-auth0-screen.js

      - name: 🔄 Update Auth0 Consent Configuration
        env:
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_MGMT_TOKEN: ${{ secrets.AUTH0_MGMT_TOKEN }}
          VERCEL_URL: ${{ env.VERCEL_URL }}
          SCREEN_NAME: consent
          ASSET_LIST_FILE: asset-tracking/consent.txt
        run: node scripts/update-auth0-screen.js

      - name: ✅ Deployment Complete
        run: |
          echo "================================"
          echo "🎉 All Screens Deployed!"
          echo "================================"
          echo "🔗 Assets URL: ${{ env.VERCEL_URL }}/assets/"
          echo "✅ Updated: login-id, signup, consent"
          echo "================================"
