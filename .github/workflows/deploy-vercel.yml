name: Deploy ACUL to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧹 Clean dist folder
        run: rm -rf dist

      - name: 🏗️ Build ACUL assets
        run: npm run build

      - name: 📄 Copy vercel.json to dist folder
        run: cp vercel.json dist/vercel.json

      - name: 📋 List built assets
        run: |
          echo "Built assets:"
          ls -lah dist/assets/
          echo "Vercel config:"
          cat dist/vercel.json

      - name: 📁 Prepare clean deployment directory
        run: |
          mkdir -p deploy-temp
          cp -r dist/* deploy-temp/
          echo "Clean deployment directory created"
          echo "Verifying vercel.json in deploy-temp:"
          cat deploy-temp/vercel.json
          echo "Files in deploy-temp:"
          ls -la deploy-temp/

      - name: 🚀 Install Vercel CLI
        run: npm install --global vercel@latest

      - name: 🚢 Deploy to Vercel
        id: deploy
        run: |
          cd deploy-temp
          DEPLOYMENT_URL=$(vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed to: $DEPLOYMENT_URL"
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT

      - name: 🔄 Update Auth0 Configuration
        env:
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_MGMT_TOKEN: ${{ secrets.AUTH0_MGMT_TOKEN }}
          VERCEL_URL: ${{ steps.deploy.outputs.url }}
        run: node scripts/update-auth0-vercel.js

      - name: ✅ Deployment Complete
        run: |
          echo "================================"
          echo "🎉 Deployment Successful!"
          echo "================================"
          echo "🔗 Live URL: ${{ steps.deploy.outputs.url }}"
          echo "================================"

      - name: 💬 Comment PR with Deployment URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 ACUL Deployed to Vercel

              **Deployment URL:** ${{ steps.deploy.outputs.url }}
              
              ✅ Auth0 configuration has been updated automatically.
              
              ### Test the deployment:
              1. Go to your Auth0 application
              2. Click the login button
              3. You should see your customized ACUL screen
              
              ---
              Deployment triggered by: @${{ github.actor }}`
            })
