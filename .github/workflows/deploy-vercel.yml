name: Deploy ACUL Screens to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_URL: https://acul-learning-155.vercel.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧹 Clean dist folder
        run: rm -rf dist

      - name: 🏗️ Build Login ID screen
        run: |
          npm run build:login-id
          mkdir -p dist-combined/login-id
          cp -r dist/* dist-combined/login-id/

      - name: 🏗️ Build Signup screen
        run: |
          rm -rf dist
          npm run build:signup
          mkdir -p dist-combined/signup
          cp -r dist/* dist-combined/signup/

      - name: 🏗️ Build Consent screen
        run: |
          rm -rf dist
          npm run build:consent
          mkdir -p dist-combined/consent
          cp -r dist/* dist-combined/consent/

      - name: 📄 Create vercel.json
        run: |
          cat > dist-combined/vercel.json << 'EOF'
          {
            "version": 2,
            "builds": [],
            "cleanUrls": true,
            "trailingSlash": false,
            "headers": [
              {
                "source": "/(.*)",
                "headers": [
                  {"key": "Access-Control-Allow-Origin", "value": "*"},
                  {"key": "Access-Control-Allow-Methods", "value": "GET, OPTIONS"}
                ]
              },
              {
                "source": "/assets/(.*)",
                "headers": [
                  {"key": "Cache-Control", "value": "public, max-age=31536000, immutable"}
                ]
              }
            ]
          }
          EOF

      - name: 📋 List built assets
        run: |
          echo "Combined structure:"
          ls -lah dist-combined/
          echo "Login ID assets:"
          ls -lah dist-combined/login-id/assets/ || true
          echo "Signup assets:"
          ls -lah dist-combined/signup/assets/ || true
          echo "Consent assets:"
          ls -lah dist-combined/consent/assets/ || true

      - name: 📁 Prepare clean deployment directory
        run: |
          mkdir -p deploy-temp
          cp -r dist-combined/* deploy-temp/
          rm -f deploy-temp/package.json deploy-temp/vite.config.js
          rm -f deploy-temp/*/package.json deploy-temp/*/vite.config.js

      - name: 🚀 Install Vercel CLI
        run: npm install --global vercel@latest

      - name: 🚢 Deploy to Vercel
        run: |
          cd deploy-temp
          vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🔄 Update Auth0 Login ID Configuration
        env:
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_MGMT_TOKEN: ${{ secrets.AUTH0_MGMT_TOKEN }}
          VERCEL_URL: ${{ env.VERCEL_URL }}/login-id
          SCREEN_NAME: login-id
        run: node scripts/update-auth0-screen.js

      - name: 🔄 Update Auth0 Signup Configuration
        env:
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_MGMT_TOKEN: ${{ secrets.AUTH0_MGMT_TOKEN }}
          VERCEL_URL: ${{ env.VERCEL_URL }}/signup
          SCREEN_NAME: signup
        run: node scripts/update-auth0-screen.js

      - name: 🔄 Update Auth0 Consent Configuration
        env:
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_MGMT_TOKEN: ${{ secrets.AUTH0_MGMT_TOKEN }}
          VERCEL_URL: ${{ env.VERCEL_URL }}/consent
          SCREEN_NAME: consent
        run: node scripts/update-auth0-screen.js

      - name: ✅ Deployment Complete
        run: |
          echo "================================"
          echo "🎉 All Screens Deployed!"
          echo "================================"
          echo "🔗 Login ID: ${{ env.VERCEL_URL }}/login-id"
          echo "🔗 Signup: ${{ env.VERCEL_URL }}/signup"
          echo "🔗 Consent: ${{ env.VERCEL_URL }}/consent"
          echo "================================"
